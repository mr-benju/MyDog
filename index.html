    <style>

      .titulo-fondo {

        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        color: white;

        text-align: center;

        padding: 40px;

        margin: 0 0 30px 0;

        font-family: 'Fredoka One', cursive;

        font-size: 3rem;

        border-radius: 15px;

        box-shadow: 0 10px 30px rgba(0,0,0,0.3);

        position: relative;

        overflow: hidden;

      }

      

      .titulo-fondo::before {

        content: '';

        position: absolute;

        top: -50%;

        left: -50%;

        width: 200%;

        height: 200%;

        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="50" font-size="20" opacity="0.1">🐕🐾🦴</text></svg>') repeat;

        animation: float 20s linear infinite;

        pointer-events: none;

      }

      

      .subtitulo-fondo {

        font-size: 1rem; 

        margin-top: 10px; 

        opacity: 0.9;

        font-family: 'Comic Neue', sans-serif;

        font-weight: normal;

      }

      

      @keyframes float {

        0% { transform: translateX(-100px) translateY(-100px); }

        100% { transform: translateX(100px) translateY(100px); }

      }

    </style>

  </head>

<!DOCTYPE html>

<html lang="en">

<head>

 <title>Bootstrap Example</title>

 <meta charset="utf-8">

 <meta name="viewport" content="width=device-width, initial-scale=1">

 <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

 <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</head>

<body>



<div class="container">

 <h2>Modal Example</h2>

 <!-- Trigger the modal with a button -->

 



 <!-- Modal -->

 <div class="modal fade" id="pastorAleman" role="dialog">

  <div class="modal-dialog">

  

   <!-- Modal content-->

   <div class="modal-content">

    <div class="modal-header">

     <button type="button" class="close" data-dismiss="modal">&times;</button>

     <h4 class="modal-title">Modal Header</h4>

    </div>

    <div class="modal-body">

     <p>Este es un perrito pastor aleman, edad: 4 años, raza amigable, etc</p>

    </div>

    <div class="modal-footer">

     <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>

    </div>

   </div>

   

  </div>

 </div>

 

</div>
