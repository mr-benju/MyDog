<!DOCTYPE html>
<html lang="es">
    
    <head>
        <meta charset="UTF-8"> <!-- Lee caracteres especiales en el navegador -->
        <meta name="viewport" content="width=device-widht, initial-scale=1.0">
        <title>Formulario de Contactos</title>
        <link rel="stylesheet" href="formulario.css"> <!-- Indexamos estilos -->
    </head>


    <!-- Cuerpo del sitio (body)-->
    <body>
        <div class="card">
            <h2>Formulario de registro </h2>
            <form id="registroForm">
                <label>Nombre: </label>
                <input type="text" placeholder="Ingrese su nombre">
                
                <label>Pais: </label>
                <select id="pais" name="pais">
                    <option>Seleccione un Pais: </option>
                </select>

                <button type="button">Llenar Formulario</button>

            </form>
        </div>
    </body>
</html>

<!-- mi js que rellena select -->
<script>
    const paises = ["Chile", "Alemania", "Peru", "Colombia"]; //delcaro un arreglo
    const select = document.getElementById("pais"); //obtengo select de paises

    paises.forEach(p => {
        
        select.innerHTML += `<option value="${p}">${p}</option>`;

    });

    
</script>
